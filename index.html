<style>
/* Layout idea: command-centre shell — fixed sidebar (rail on phone), summary tiles first, then "today" queue, then detail lists; profiles open in a right-hand drawer. Single dark theme by brand choice. */
:root{
  --obsidian:#0b0b0d;
  --charcoal:#16161a;
  --panel:#1d1d22;
  --line:#2c2c33;
  --ink:#f4f3f1;
  --ink-2:#b4b2b8;
  --ink-3:#7d7b84;
  --crimson:#d7263d;
  --crimson-soft:rgba(215,38,61,.14);
  --good:#3fb27f; --warn:#e3a83b; --crit:#ef4f5f; --info:#7aa7e0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--obsidian);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--crimson);text-underline-offset:3px}
a:hover{color:#fff;text-decoration-thickness:2px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
/* sidebar */
.side{background:var(--charcoal);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:18px 12px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.crown{width:34px;height:34px;border-radius:8px;background:var(--crimson);display:grid;place-items:center;flex:none}
.logo b{font:700 19px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;display:block}
.logo small{font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.nav:hover{background:var(--panel);color:var(--ink)}
.nav.on{background:var(--crimson-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--crimson)}
.nav .n{margin-left:auto;font:500 12px var(--mono);color:var(--ink-3)}
.nav.soon{opacity:.45;cursor:default}
.nav.soon:hover{background:none;color:var(--ink-2)}
.navlabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 4px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--obsidian);position:relative;z-index:5}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:60vh;overflow:auto;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.results button:hover,.results button:focus{background:var(--charcoal)}
.results small{color:var(--ink-3);display:block}
.brandsel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.bell{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.bell i{position:absolute;top:-6px;right:-6px;background:var(--crimson);color:#fff;font:600 11px/1 var(--mono);font-style:normal;padding:4px 6px;border-radius:99px}
.view{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font:700 34px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font:600 20px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font:600 15px/1.3 var(--body);margin:0}
.sub{color:var(--ink-2);margin:4px 0 0;max-width:70ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.card{background:var(--charcoal);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.tile{background:var(--charcoal);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.tile:hover{border-color:var(--crimson)}
.tile .v{font:600 34px/1 var(--display);font-variant-numeric:tabular-nums}
.tile .l{color:var(--ink-2);font-size:13px}
.tile .h{color:var(--ink-3);font-size:11.5px}
.tile.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--crit)}
.tile.warn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
.tile.ok::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--good)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
/* ops queue */
.ops{display:flex;flex-direction:column}
.op{display:grid;grid-template-columns:4px 1fr auto;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.op:first-child{border-top:0}
.op .bar{align-self:stretch;border-radius:2px}
.op .t{font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.op .t:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--crimson)}
.op .why{color:var(--ink-2);font-size:13px;margin-top:2px}
.op .why q{color:var(--ink-3);font-style:italic}
.op .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--crimson);border-color:var(--crimson);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;color:var(--ink-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-traffic{color:var(--good);border-color:rgba(63,178,127,.35)}
.s-live{color:var(--info);border-color:rgba(122,167,224,.35)}
.s-approved{color:var(--warn);border-color:rgba(227,168,59,.35)}
.s-inactive{color:var(--ink-3)}
.s-wait{color:#c79be0;border-color:rgba(199,155,224,.35)}
.tag{font-size:11.5px;color:var(--ink-2);background:var(--panel);border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag.red{color:#fff;background:rgba(239,79,95,.25)}
.tag.amber{color:#fff;background:rgba(227,168,59,.22)}
/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:120px 1fr 32px;align-items:center;gap:10px;font-size:13px;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;color:var(--ink-2)}
.brow:hover{color:var(--ink)}
.brow .track{height:12px;background:var(--panel);border-radius:4px;overflow:hidden}
.brow .fill{height:100%;background:var(--crimson);border-radius:0 4px 4px 0}
.brow b{font:500 13px var(--mono);color:var(--ink);text-align:right}
/* filters + table */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--charcoal);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--crimson-soft);border-color:var(--crimson);color:#fff}
.chip span{color:var(--ink-3);font-family:var(--mono);font-size:12px;margin-left:4px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--charcoal)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--charcoal)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--panel)}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* matrix */
.mx td,.mx th{text-align:center;padding:8px 6px}
.mx th{white-space:normal;min-width:86px;font-size:10.5px;line-height:1.3;vertical-align:bottom}
.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:var(--charcoal);z-index:1}
.dot{display:inline-block;font:500 11.5px var(--mono);padding:3px 6px;border-radius:5px;background:rgba(63,178,127,.15);color:#bfe8d4}
.dot.txt{background:rgba(227,168,59,.18);color:#f3d79f}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--obsidian);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dbody{overflow-y:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:16px}
.close{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;flex:none;font-size:18px}
.sec h2{font-size:16px;margin-bottom:10px;color:var(--ink-2)}
dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0;font-size:14px}
dt{color:var(--ink-3)}
dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.missing{color:var(--warn);font-style:italic}
.src{font:400 11px var(--mono);color:var(--ink-3)}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 12px 18px}
.tl::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--charcoal);border:2px solid var(--ink-3)}
.tl.done::before{background:var(--good);border-color:var(--good)}
.tl.flag::before{background:var(--warn);border-color:var(--warn)}
.tl b{display:block;font-weight:500}
.tl span{color:var(--ink-3);font-size:12.5px;white-space:pre-wrap}
.stages{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 12px}
.stages i{flex:1 1 40px;height:6px;border-radius:3px;background:var(--panel)}
.stages i.on{background:var(--crimson)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-3)}
.form .full{grid-column:1/-1}
.form.three{grid-template-columns:1fr 1fr 1fr}
.form.four{grid-template-columns:1.2fr 1.5fr 1fr 1.2fr}
.form select{min-width:0}
.form input,.form select,.form textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14px}
.notice{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;color:var(--ink-2);font-size:13.5px}
.notice b{color:var(--ink)}
.empty{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.empty div{border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--ink-3);font-size:13px}
.empty div b{display:block;font:600 22px var(--display);color:var(--ink-3)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--charcoal);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font-size:13px;display:flex;flex-direction:column;gap:4px}
.kc:hover{border-color:var(--crimson)}
.kc b{font-size:14px}
.drop{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-3)}
.drop.over{border-color:var(--crimson);background:var(--crimson-soft);color:var(--ink)}
button[disabled]{opacity:.45;cursor:not-allowed}
.col.over{border-color:var(--crimson);background:var(--crimson-soft)}
.kc[draggable=true]{cursor:grab}
.sync{font-size:12px;color:var(--ink-3);white-space:nowrap}
.btn.t{font-weight:500}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--obsidian);padding:10px 16px;border-radius:10px;font-weight:500;z-index:40;display:none}
.toast.show{display:block}
.mob{display:none}
@media (max-width:900px){
  .two{grid-template-columns:1fr}
  .form.four{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .main{order:1}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tile .v{font-size:28px}
  .side{order:2;flex-direction:row;padding:6px;gap:2px;border-right:0;border-top:1px solid var(--line);overflow-x:auto}
  .logo,.navlabel,.nav.soon{display:none}
  .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;min-width:68px;text-align:center}
  .nav .n{display:none}
  .nav.on{box-shadow:inset 0 -3px 0 var(--crimson)}
  .top{padding:10px 16px}
  .brandsel,.sync{display:none}
  .view{padding:16px}
  h1{font-size:28px}
  dl{grid-template-columns:1fr;gap:2px}
  dd{margin-bottom:8px}
  .form,.form.three,.form.four{grid-template-columns:1fr}
  .op{grid-template-columns:4px 1fr}
  .op .acts{grid-column:2;justify-content:flex-start}
  .mob{display:inline}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}.view{scroll-behavior:auto}}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const A = D.affiliates, INV = D.investments, LEADS = D.leads;
A.forEach(a => { if (!a.handover && a.prevHandover) { a.handover = a.prevHandover; a.handoverPrev = true; } });
const hvl = a => a.handoverPrev ? 'Handover notes (column removed in the latest workbook, confirm still open)' : 'Handover notes';
const byKey = Object.fromEntries(A.map(a => [a.key, a]));
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

const P = D.prospects, byPKey = Object.fromEntries(P.map(p => [p.key, p]));

/* ---------- store: shared database when available, this browser otherwise ---------- */
const LS_KEY = '4king-ops-v2';
const Store = {
  mode:'local', canWrite:true, me:null, aff:{}, pros:{}, ops:{done:{}, snooze:{}}, log:[], names:{}, perf:{}, periods:{}, imports:{}, newaff:{}, sbx:{},
  db:null, user:null, stale:false,
  loadLocal(){ try { const r = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if (r) { this.aff=r.aff||{}; this.pros=r.pros||{}; this.ops=r.ops||this.ops; this.log=r.log||[]; this.perf=r.perf||{}; this.imports=r.imports||{}; this.newaff=r.newaff||{}; this.sbx=r.sbx||{}; this.periods=r.periods||{}; } } catch(e) {} },
  saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({aff:this.aff, pros:this.pros, ops:this.ops, log:this.log.slice(0,300), perf:this.perf, periods:this.periods, imports:this.imports, newaff:this.newaff, sbx:this.sbx})); } catch(e) { toast('Could not save in this browser'); } },
  async init(){
    this.loadLocal();
    if (!window.claude || !window.claude.use) return;
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch(e) {}
    if (!db) return;
    this.db = db; this.user = user; this.mode = 'shared'; this.aff = {}; this.pros = {}; this.ops = {done:{}, snooze:{}}; this.log = []; this.perf = {}; this.periods = {}; this.imports = {}; this.newaff = {}; this.sbx = {};
    try { if (user) { const c = await user.can('data.write'); if (c === false) this.canWrite = false; this.me = await user.id(); } } catch(e) {}
    const timer = setTimeout(() => { this.stale = true; setSync(); }, 10000);
    const ok = () => { clearTimeout(timer); this.stale = false; setSync(); };
    const fail = e => { clearTimeout(timer); this.stale = true; setSync(e && e.code); };
    const toMap = snap => Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    db.collection('aff').onSnapshot(s => { this.aff = toMap(s); if (!s.metadata.fromCache) ok(); refresh(); }, fail);
    db.collection('pros').onSnapshot(s => { this.pros = toMap(s); if (!s.metadata.fromCache) ok(); refresh(); }, fail);
    db.doc('meta/ops').onSnapshot(s => { const d = s.data(); this.ops = {done:(d&&d.done)||{}, snooze:(d&&d.snooze)||{}}; refresh(); }, fail);
    db.collection('perf').onSnapshot(s => { this.perf = toMap(s); _aggCache = null; refresh(); }, fail);
    db.collection('periods').onSnapshot(s => { this.periods = toMap(s); refresh(); }, fail);
    db.collection('imports').onSnapshot(s => { this.imports = toMap(s); refresh(); }, fail);
    db.collection('newaff').onSnapshot(s => { this.newaff = toMap(s); refresh(); }, fail);
    db.collection('sbx').onSnapshot(s => { this.sbx = toMap(s); refresh(); }, fail);
    db.collection('log').orderBy('at','desc').limit(200).onSnapshot(s => { this.log = s.docs.map(d => d.data()); resolveNames(); refresh(); }, fail);
    setSync();
  },
  async write(path, body){
    if (path.startsWith('perf/')) setTimeout(() => { _aggCache = null; }, 0);
    if (this.mode !== 'shared') { const [c, id] = path.split('/'); if (c === 'meta') this.ops = body; else if (this[c]) this[c][id] = body; this.saveLocal(); return true; }
    try { await this.db.doc(path).set(body); return true; }
    catch(e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random()*600)); try { await this.db.doc(path).set(body); return true; } catch(e2) {} }
      if (e && e.code === 'invalid_argument') { this.canWrite = false; setSync(); }
      toast(e && e.code === 'quota_exceeded' ? 'The database is full — remove old records to save more' : 'Could not save. Check your connection and try again.');
      return false;
    }
  },
  async del(path){ const [c, id] = path.split('/'); if (this[c]) delete this[c][id]; if (this.mode !== 'shared') { this.saveLocal(); return true; } try { await this.db.doc(path).delete(); return true; } catch(e) { toast('Could not delete'); return false; } },
  async saveAff(key, body){ this.aff[key] = body; return this.write('aff/'+key, body); },
  async savePros(key, body){ this.pros[key] = body; return this.write('pros/'+key, body); },
  async saveOps(){ return this.write('meta/ops', this.ops); },
  async addLog(key, what, byName){
    const e = {at:new Date().toISOString(), key, what, by:this.me||null, byName:byName||null};
    this.log.unshift(e);
    if (this.mode !== 'shared') { this.saveLocal(); return; }
    try { await this.db.collection('log').add(e); } catch(err) {}
  }
};
async function resolveNames(){
  if (!Store.user || !Store.user.profiles) return;
  const ids = [...new Set(Store.log.map(l => l.by).filter(id => id && !(id in Store.names)))];
  if (!ids.length) return;
  try { const ps = await Store.user.profiles(ids); ids.forEach(id => Store.names[id] = (ps[id] && ps[id].name) || ''); refresh(); } catch(e) {}
}
const whoName = e => (e.by && Store.names[e.by]) || e.byName || 'Someone';
function setSync(code){
  const el = document.getElementById('sync'); if (!el) return;
  if (Store.mode !== 'shared') { el.textContent = 'Saved in this browser'; el.title = 'Open the published page while signed in to share changes with your team'; return; }
  if (!Store.canWrite) { el.textContent = 'View only'; el.title = 'You can read but not change shared data'; return; }
  el.textContent = Store.stale ? 'Not synced yet' : 'Synced with team'; el.title = Store.stale ? 'Changes may not have reached the shared database yet' : 'Changes are shared with everyone who has this page';
}
let refreshT = null;
function refresh(){
  clearTimeout(refreshT);
  refreshT = setTimeout(() => {
    updateBell();
    const busy = document.activeElement && document.getElementById('drawer').contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!document.querySelector('.view input:focus') && !(lastRoute === 'uploads' && U && U.files.length)) draw(lastRoute, true);
    if (!busy && openDrawer) openDrawer();
  }, 120);
}
let openDrawer = null;
const ov = k => Store.aff[k] || {};
const pov = k => Store.pros[k] || {};
let myName = ''; try { myName = localStorage.getItem('4king-name') || ''; } catch(e) {}
function rememberName(n){ myName = n; try { localStorage.setItem('4king-name', n); } catch(e) {} }

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function linkify(t){
  if (!t) return '';
  return esc(t).replace(/(https?:\/\/[^\s<,;]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'')}</a>`);
}
const first = s => (s||'').split('\n')[0].trim();
const short = (s,n=90) => { s = (s||'').replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n-1)+'…' : s; };
const fmtD = d => d ? new Date(d+'T00:00:00').toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}) : '';
const daysSince = d => Math.round((TODAY - new Date(d+'T00:00:00'))/864e5);
const zar = n => 'R' + Math.round(n).toLocaleString('en-ZA').replace(/,/g,' ');
function statusCls(s){
  s = (s||'').toLowerCase();
  if (s.includes('traffic')) return 's-traffic';
  if (s.includes('live')) return 's-live';
  if (s.includes('approved')) return 's-approved';
  if (s.includes('inactive')) return 's-inactive';
  if (s.includes('wait')) return 's-wait';

function sheetSteps(a){ return a.contractSteps.slice().sort((x,y)=> (x.date||'9999').localeCompare(y.date||'9999')); }
function lastStep(a){
  const dated = a.contractSteps.filter(s=>s.date);

/* ---------- condition rules (every item cites the cell it came from) ---------- */
const RX_COMM = /(outstanding commission|oustanding commission|commission is paid|commission in full|outstanding invoices)/i;
const RX_WAIT = /(waiting for his contract|never received a response)/i;
const RX_COMP = /(WCGRB|safety index|FIC\b|non-compliant)/i;
function quote(t, rx){
  if (!t) return '';
  const lines = t.split('\n').map(l=>l.trim()).filter(Boolean);
  const hit = rx ? lines.find(l => rx.test(l)) : lines[0];
  return short(hit || lines[0], 140);
}
function buildOps(){
  const ops = [];
  A.forEach(a => {
    if (!brandOK(a)) return;
    const who = first(a.username);
    if (amendReq(a)) {
      const st = a.contractSteps.find(s => /amendment/i.test(s.text||''));
      ops.push({id:'amend-'+a.key, key:a.key, sev:'crit', cat:'Contract', title:`${who}: affiliate requested contract amendments`, why:`Recorded under “${st.step}”`, q:quote(st.text, /amend/i)});
    }
    if (a.contractComment) ops.push({id:'ccom-'+a.key, key:a.key, sev:/FIC/.test(a.contractComment)?'crit':'warn', cat:'Contract', title:`${who}: contract issue noted`, why:'Contract “Comments” column', q:short(a.contractComment,140)});
    const commSrc = [a.handover, a.notes].find(t => RX_COMM.test(t||''));
    if (commSrc) ops.push({id:'comm-'+a.key, key:a.key, sev:'crit', cat:'Payment', title:`${who}: commission payment dispute`, why: commSrc===a.handover ? hvl(a) : 'Notes', q:quote(commSrc, RX_COMM)});
    if (RX_WAIT.test(a.handover||'')) ops.push({id:'wait-'+a.key, key:a.key, sev:'warn', cat:'Follow-up', title:`${who}: approved but not sending traffic`, why:hvl(a), q:quote(a.handover, RX_WAIT)});
    if (/request/i.test(a.feePaymentStatus||'')) ops.push({id:'fee-'+a.key, key:a.key, sev:'warn', cat:'Payment', title:`${who}: listing fee ${a.fee} — ${a.feePaymentStatus.toLowerCase()}`, why:'Fee / Payment status columns', q:''});
    const compSrc = [a.handover, a.contractComment, a.notes].find(t => RX_COMP.test(t||''));
    if (compSrc) ops.push({id:'comp-'+a.key, key:a.key, sev:'warn', cat:'Compliance', title:`${who}: compliance review needed`, why:'Notes mention a regulator or compliance item', q:quote(compSrc, RX_COMP)});
    if (/check in again/i.test(a.handover||'')) ops.push({id:'chk-'+a.key, key:a.key, sev:'info', cat:'Follow-up', title:`${who}: check in on site upgrade`, why:hvl(a), q:quote(a.handover, /check in/i)});
    if (/^(traffic|live|approved)/i.test(a.status) && (a.dealType==='Not recorded' || a.dealType==='Pending')) ops.push({id:'deal-'+a.key, key:a.key, sev:'info', cat:'Data', title:`${who}: ${a.status} but no approved deal recorded`, why:`Approved deal column is ${a.approvedDeal ? '“'+a.approvedDeal+'”' : 'empty'}`, q:''});
  });

  if (board.length) ops.push({id:'board-group', route:'contracts', sev:'warn', cat:'Contract', title:`${board.length} contracts sent to the Board with no outcome recorded`, why:`Oldest submission ${fmtD(board.map(a=>boardStep(a).date).sort()[0])}. The sheet has no column for the Board's decision, so set each one's status explicitly.`, q:''});
  INV.filter(i => /renewal/i.test(i.status)).forEach(i => ops.push({id:'renew-'+i.key, route:'investments', sev:'info', cat:'Investment', title:`Placement renewal: ${i.urls[0] ? i.urls[0].replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'') : i.name} — ${i.zar ? zar(i.zar) : i.fee} ${i.duration||''}`, why:'Investment - Deals, status “Renewal” (no renewal date in sheet)', q:short(i.comments,100)}));
  D.issues.forEach((x,ix) => ops.push({id:'dupe-'+x.id, route:'migration', sev:'info', cat:'Data', title:x.detail, why:'Same ID on more than one row of '+D.affSheet, q:''}));
  const lm = lastFull(); perfAlerts(lm).filter(x => x.sev !== 'info').forEach(x => ops.push({id:'perf-'+x.key+'-'+lm+'-'+x.title.slice(0,30), key:x.key, sev:x.sev, cat:'Performance', title:x.title, why:x.why + ' (' + monthLabel(lm) + ' report)', q:''}));
  PX().forEach(p => {
    const f = followState(p);
    if (f && f.kind === 'due') ops.push({id:'fu-'+p.key+'-'+p.followUp, pkey:p.key, sev:'warn', cat:'Follow-up', title:`Follow up with ${p.title}`, why:`Follow-up date ${fmtD(p.followUp)}${p.nextAction?' · '+p.nextAction:''}`, q:''});
    else if (f && f.kind === 'stale' && p.kind === 'Affiliate lead') ops.push({id:'stale-'+p.key, pkey:p.key, sev:'info', cat:'Lead', title:`${p.title}: ${p.stage.toLowerCase()}, no contact for ${f.days} days`, why:`Last contact ${fmtD(f.last)} (Leads sheet)`, q:short(p.comments,100)});
  });
  const quiet = PX().filter(p => p.kind !== 'Affiliate lead' && (followState(p)||{}).kind === 'stale');

  const now = Date.now();
  return ops.filter(o => !Store.ops.done[o.id] && !(Store.ops.snooze[o.id] && Store.ops.snooze[o.id] > now));
}

function affMatches(a){
  if (!brandOK(a)) return false;
  const f = affFilter;
  if (f.status !== 'all' && a.status.toLowerCase() !== f.status.toLowerCase()) return false;
  if (f.deal !== 'all' && a.dealType !== f.deal) return false;
  if (f.flag === 'contract' && !(amendReq(a) || a.contractComment)) return false;
  if (f.flag === 'comm' && !RX_COMM.test((a.handover||'')+(a.notes||''))) return false;
  if (f.flag === 'nocontract' && !( !a.contractSteps.length && !/inactive/i.test(a.status))) return false;
  if (f.flag === 'missing' && !a.missing.length) return false;
  if (f.text) { const hay = JSON.stringify(a).toLowerCase(); if (!hay.includes(f.text.toLowerCase())) return false; }
  return true;
}

const STALE_DAYS = 21;
function PX(){

  return [...base, ...added].filter(p => !p.deleted);
}
const pByKey = k => PX().find(p => p.key === k);
function lastTouch(p){ const t = p.touches.filter(x => x.date && !x.suspect).map(x => x.date).sort(); return t[t.length-1] || null; }
function followState(p){
  if (p.followUp) return p.followUp <= isoToday() ? {kind:'due'} : {kind:'set'};
  if (!ACTIVE.has(p.stage)) return null;
  const lt = lastTouch(p); if (!lt) return null;

  return days > STALE_DAYS ? {kind:'stale', days, last:lt} : null;
}
function isoToday(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const dom = u => (u||'').replace(/^https?:\/\/(www\.)?/,'').replace(/\/.*$/,'').toLowerCase();

function findAff(id, user){

function recOutcome(r){
  if (r.status === 'failed') return ['Failed extraction','crit'];
  if (r.flags.includes('nomonth')) return [U.mode === 'multi' ? 'No month found' : 'No month','crit'];
  if (r.flags.includes('conflict')) { const kept = U.recs.find(x => x.group === r.group && U.keep[x.file+'#'+x.row]); if (!kept) return ['Conflict','crit']; if (kept !== r) return ['Conflict, not used','info']; }
  if (r.flags.includes('review')) return ['Choose affiliate','warn'];
  if (r.flags.includes('dupe-same')) return ['Duplicate, skipped','info'];
  if (r.status === 'missing') return ['Missing data, not imported','info'];
  if (r.prestart) return ['Before first activity, not imported','info'];
  if (r.flags.includes('unchanged')) return ['Already imported, same figures','info'];
  if (r.flags.includes('differs')) return U.correct[r.file+'#'+r.row] ? ['Correction','warn'] : ['Differs from saved, held back','warn'];
  if (r.flags.includes('new') && U.kind !== 'monthly' && r.how !== 'new-chosen') return ['Unmatched, held back','warn'];
  if (r.flags.includes('new')) return ['New affiliate','warn'];
  if (r.status === 'zero') return ['Zero activity','ok'];
  return [r.flags.includes('review-id') ? 'Matched by username' : 'Will import','ok'];
}

      return `<tr class="click" data-act="open:a-${esc(r.key)}"><td class="mono"><b>${r.rank}</b></td><td class="mono" style="font-size:12.5px">${mv}</td>
        <td><b>${esc(name(r.key))}</b> ${a?pill(a.status):''}<div class="src">${a?esc(a.dealType):''}${a&&a.approvedDeal?' · '+esc(first(a.approvedDeal)):''}</div></td>
        <td><div style="display:flex;align-items:center;gap:8px"><span style="flex:1;height:10px;background:var(--panel);border-radius:3px;overflow:hidden"><span style="display:block;height:100%;width:${w}%;background:${r.v<0?'var(--crit)':'var(--crimson)'};border-radius:0 3px 3px 0"></span></span><span class="mono" style="min-width:90px;text-align:right">${rkFmt(r.v, def)}</span></div>${r.parts?`<div class="src">${RKC.map(c=>`${RK.find(x=>x.k===c).l}: ${r.parts[c]==null?'n/a':r.parts[c].toFixed(0)}`).join(' · ')}</div>`:''}</td>
        ${total?`<td class="mono">${r.v>0?(r.v/total*100).toFixed(1)+'%':'—'}</td>`:''}
        <td class="mono">${fmtN(r.m.ftd,'ftd')}</td><td class="mono" style="${r.m.ngr<0?'color:var(--crit)':''}">${fmtN(r.m.ngr,'ngr')}</td><td class="mono">${pctS(r.m.ftd, r.m.regs)}</td><td class="mono">${rkSel.range.startsWith('p:')?'period':r.months}</td></tr>`; }).join('') || `<tr><td colspan="9" class="muted">No affiliate has enough data for this measure in this period.</td></tr>`}
    </tbody></table></div>
    ${out.length||missing.length?`<section class="card"><h2 style="margin-bottom:8px">Not ranked</h2>
      ${out.map(r=>`<div class="src" style="padding:3px 0"><a href="#a-${esc(r.key)}">${esc(name(r.key))}</a> — ${esc(r.why)}</div>`).join('')}
      ${missing.length?`<div class="src" style="padding:6px 0 0">No figures in this period, although their status is “Traffic coming in” or “Live on site”: ${missing.map(a=>`<a href="#a-${esc(a.key)}">${esc(first(a.username))}</a>`).join(', ')}</div>`:''}
    </section>`:''}
    <p class="src">How this works: totals are added up from each affiliate's confirmed records for the months in the period (an affiliate with two IDs is counted once). Conversion rates and per-FTD values only rank affiliates with enough volume (${RK.filter(d=>d.min).map(d=>d.l+': '+d.minL).join('; ')}), so a single lucky signup doesn't top the table. The overall score is the average of each affiliate's position (0 = lowest, 100 = highest) on FTDs, NGR, deposit sum and registration → FTD, and needs at least 3 of those 4. NGR is revenue before costs, not profit. Movement compares with ${prevR?esc(prevR.label):'no earlier period (not available for this selection)'}.</p>
  </div>`;
  document.getElementById('rk-range').addEventListener('change', e => { rkSel.range = e.target.value; viewRankings(); });
}
function affRankLine(key){
  const ms = perfMonths(); if (!ms.length) return '';
  const last = lastFull(); const sums = rkSums('latest');
  if (!sums[key]) return '';
  const parts = ['ftd','ngr'].map(k => { const d = RK.find(x=>x.k===k); const {rows} = rkRank(sums, d); const r = rows.find(x => x.key === key); return r ? `#${r.rank} of ${rows.length} by ${d.l}` : null; }).filter(Boolean);
  return parts.length ? `<div class="notice"><b>Ranking in ${esc(monthLabel(last))}:</b> ${parts.join(' · ')} <button class="btn" data-act="go:rankings" style="margin-left:6px">Rankings</button></div>` : '';
}

/* ---------- search ---------- */
const Q = document.getElementById('q'), R = document.getElementById('results');
Q.addEventListener('input', () => {
  const t = Q.value.trim().toLowerCase(); if (t.length < 2) { R.classList.remove('open'); return; }
  const hits = [];
  A.forEach(a => { const h = [a.username,a.name,a.urlRaw,a.emails.join(' '),a.telegram.join(' '),a.promo,a.exposure,a.ids.join(' '),a.notes].join(' ').toLowerCase(); if (h.includes(t)) hits.push({act:'open:a-'+a.key, t:first(a.username), s:`Affiliate · ${a.status} · ${a.name||''}`}); });
  PX().forEach(p => { if ([p.title,p.person,p.company,p.urlRaw,p.contact,p.comments,(p.emails||[]).join(' ')].join(' ').toLowerCase().includes(t)) hits.push({act:'p:'+p.key, t:p.title, s:`${p.kind} · ${p.stage}`}); });
  INV.forEach(i => { if ([i.name,i.company,i.urlRaw,i.comments].join(' ').toLowerCase().includes(t)) hits.push({act:'go:investments', t:i.company||i.urlRaw||i.name, s:`Investment · ${i.status}`}); });
  R.innerHTML = hits.slice(0,20).map(h=>`<button data-act="${esc(h.act)}">${esc(h.t)}<small>${esc(h.s)}</small></button>`).join('') || '<div style="padding:12px 14px" class="muted">No matches</div>';
  R.classList.add('open');
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) R.classList.remove('open'); });

/* ---------- routing & actions ---------- */
let lastRoute = 'command';
function render(){
  const h = (location.hash||'#command').slice(1);
  if (h.startsWith('a-')) { if (!document.querySelector('.view .wrap')) { lastRoute='affiliates'; draw('affiliates'); } openProfile(h.slice(2)); return; }
  closeDrawerSilent(); draw(h);
}
function closeDrawerSilent(){ openDrawer = null; document.getElementById('drawer').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
function draw(r, keep){
  const views = {command:viewCommand, affiliates:viewAffiliates, contracts:viewContracts, investments:viewInvestments, leads:viewPipeline, migration:viewMigration, performance:viewPerformance, uploads:viewUploads, rankings:viewRankings};
  if (!views[r]) r = 'command';
  lastRoute = r;
  document.querySelectorAll('.nav[data-r]').forEach(n => n.classList.toggle('on', n.dataset.r===r));
  const st = V.scrollTop; views[r](); V.scrollTop = keep ? st : 0;
}
function go(r){ if (location.hash === '#'+r) draw(r); else location.hash = r; }
function updateBell(){ document.getElementById('bellN').textContent = buildOps().length; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const [cmd, ...rest] = el.dataset.act.split(':'); const arg = rest.join(':');
  if (!cmd) return;
  if (cmd === 'open') { R.classList.remove('open'); if (arg.startsWith('a-')) location.hash = arg; else go(arg); }
  else if (cmd === 'lead') { R.classList.remove('open'); openLead(arg); }
  else if (cmd === 'go') { if (arg==='dupes') { document.getElementById('dupes')?.scrollIntoView(); } else go(arg); }
  else if (cmd === 'close') closeDrawer();
  else if (cmd === 's') { affFilter = {...affFilter, status:arg, flag:null}; go('affiliates'); }
  else if (cmd === 'd') { affFilter = {...affFilter, deal:arg, flag:null}; go('affiliates'); }
  else if (cmd === 'f') { affFilter = {status:'all', deal:'all', flag:null, text:''}; go('affiliates'); }
  else if (cmd === 'flag') { affFilter = {status:'all', deal:'all', flag: affFilter.flag===arg && lastRoute==='affiliates' ? null : arg, text:''}; go('affiliates'); }
  else if (cmd === 'done') { if (!Store.canWrite) return toast('View-only access'); Store.ops.done = {...Store.ops.done, [arg]: new Date().toISOString()}; Store.saveOps(); Store.addLog(arg, `Action marked done: ${el.closest('.op')?.querySelector('.t')?.textContent||arg}`, myName); refresh(); toast('Marked done'); }
  else if (cmd === 'snooze') { if (!Store.canWrite) return toast('View-only access'); Store.ops.snooze = {...Store.ops.snooze, [arg]: Date.now()+864e5}; Store.saveOps(); refresh(); toast('Snoozed until tomorrow'); }
  else if (cmd === 'p') { R.classList.remove('open'); openProspect(arg); }
  else if (cmd === 'uptab') { upTab = arg; viewUploads(); }
  else if (cmd === 'upreset') { newSession(); viewUploads(); }
  else if (cmd === 'masterstats') masterStatsSession();
  else if (cmd === 'upf') { U.filter = arg; viewUploads(); }
  else if (cmd === 'allowsame') { U.allowSameFile = el.checked; validate(); viewUploads(); }
  else if (cmd === 'corr') { U.correct[arg] = el.checked; viewUploads(); }
  else if (cmd === 'keep') { const r = U.recs.find(x => x.file+'#'+x.row === arg); if (r) U.recs.filter(x => x.group === r.group).forEach(x => delete U.keep[x.file+'#'+x.row]); if (el.checked) U.keep[arg] = true; validate(); viewUploads(); }
  else if (cmd === 'upconfirm') confirmUpload();
  else if (cmd === 'batch') { const [k, ...id] = arg.split(':'); openBatch(k, id.join(':')); }
  else if (cmd === 'fix') openCorrection(arg);
  else if (cmd === 'psort') { perfSel.sort = arg; viewPerformance(); }
  else if (cmd === 'rkm') { rkSel.metric = arg; viewRankings(); }
  else if (cmd === 'sbxdel') { Store.del('sbx/'+arg).then(() => { closeDrawer(); refresh(); toast('Test import deleted'); }); }
  else if (cmd === 'sbxclear') { (async () => { for (const id of Object.keys(Store.sbx)) await Store.del('sbx/'+id); refresh(); toast('Test imports deleted'); })(); }
  else if (cmd === 'padd') openAddProspect();
  else if (cmd === 'pview') { pf.view = arg; viewPipeline(); }
  else if (cmd === 'pk') { pf.kind = arg; viewPipeline(); }
  else if (cmd === 'pflag') { pf.flag = pf.flag === arg ? null : arg; viewPipeline(); }
  else if (cmd === 'pf') { pf = {...pf, kind:'all', q:'', flag: arg==='all' ? null : arg}; if (arg==='stale'||arg==='due') pf.view='list'; go('leads'); }
  else if (cmd === 'pclearfu') { const o = {...pov(arg), followUp:null}; Store.savePros(arg, o).then(ok => { if (ok) { Store.addLog('p:'+arg, 'Follow-up cleared', myName); refresh(); } }); }
  else if (cmd === 'pdel') { const o = {...pov(arg), deleted:true}; Store.savePros(arg, o).then(ok => { if (ok) { Store.addLog('p:'+arg, `Deleted prospect ${o.title}`, myName); closeDrawer(); refresh(); } }); }
  else if (cmd === 'copyemail') { const v = document.getElementById('p-email').value; try { navigator.clipboard.writeText(v).then(()=>toast('Email copied'), ()=>toast('Copy was blocked. Select the text and copy it.')); } catch(err) { toast('Copy was blocked. Select the text and copy it.'); } }
  else if (cmd === 'copyjson') { const txt = JSON.stringify({affiliates:Store.aff, prospects:Store.pros, actions:Store.ops, log:Store.log}, null, 1); try { navigator.clipboard.writeText(txt).then(()=>toast('Copied'), ()=>toast('Copy was blocked by the browser')); } catch(err) { toast('Copy was blocked by the browser'); } }
});
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.kc[role=button]')) e.target.click(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); R.classList.remove('open'); } });
document.getElementById('bell').addEventListener('click', () => { go('command'); setTimeout(()=>document.getElementById('today')?.scrollIntoView(), 30); });
document.getElementById('brand').addEventListener('change', () => { draw(lastRoute); updateBell(); });
window.addEventListener('hashchange', render);
document.getElementById('n-aff').textContent = A.length;
document.getElementById('n-inv').textContent = INV.length;
document.getElementById('n-lead').textContent = P.length;
updateBell(); render(); setSync();
Store.init().then(() => { setSync(); refresh(); });
</script>
</body>
</html>
